# WebKitGTK's bubblewrap sandbox needs a user namespace on Ubuntu 24.04.
abi <abi/4.0>,
include <tunables/global>

profile @PACKAGE@ /opt/@PACKAGE@/goh-desktop flags=(unconfined) {
  userns,

  # Launch the bundled engine with the normal unconfined-label policy.
  /opt/@PACKAGE@/goh Ux,
  include if exists <local/@PACKAGE@>
}
