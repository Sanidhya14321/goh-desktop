name: Native package
on:
  workflow_call:
    inputs:
      runner: { type: string, required: true }
      target: { type: string, required: true }
      engine_tag: { type: string, required: true }
      channel: { type: string, required: true }
      version: { type: string, required: true }
      sign: { type: boolean, required: true }
permissions:
  contents: read
  attestations: read
  id-token: write
jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    environment: ${{ inputs.sign && (startsWith(inputs.target, 'darwin') && 'mac-signing' || startsWith(inputs.target, 'windows') && 'windows-signing' || 'linux-release') || 'desktop-dry-run' }}
    env:
      GH_TOKEN: ${{ github.token }}
      GOPROXY: https://proxy.golang.org|direct
      ENGINE_TAG: ${{ inputs.engine_tag }}
      TARGET: ${{ inputs.target }}
      CHANNEL: ${{ inputs.channel }}
      DESKTOP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ubuntu webview and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb xauth dbus-x11
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $tool)) { choco install nsis --version 3.11 -y --no-progress }
          if (!(Test-Path $tool)) { throw "NSIS executable was not found" }
          "MAKENSIS=$tool" >> $env:GITHUB_ENV
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: go test ./...
      - run: go vet ./...
      - name: Fetch and verify upstream binaries
        shell: bash
        run: python scripts/fetch-engine.py "$ENGINE_TAG" "$TARGET" .cache/engine
      - name: Package development build
        shell: bash
        run: python scripts/package.py --target "$TARGET" --engine .cache/engine --engine-tag "$ENGINE_TAG" --version "$DESKTOP_VERSION" --output out/dev
      - name: Smoke-test installed Ubuntu package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package=(out/dev/*.deb)
          sudo apt-get install -y "./${package[0]}"
          xvfb-run -a dbus-run-session -- python scripts/smoke.py "${package[0]}" --installed --launcher --work "$RUNNER_TEMP/goh-smoke"
          xvfb-run -a dbus-run-session -- python scripts/smoke.py "${package[0]}" --installed --launcher --mode workspace --work "$RUNNER_TEMP/goh-workspace"
          xvfb-run -a dbus-run-session -- python scripts/smoke.py "${package[0]}" --installed --launcher --mode audit --work "$RUNNER_TEMP/goh-audit"
      - name: Smoke-test installed macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package=(out/dev/*.dmg)
          python scripts/smoke.py "${package[0]}" --launcher --work "$RUNNER_TEMP/goh-smoke"
          python scripts/smoke.py "${package[0]}" --launcher --mode workspace --work "$RUNNER_TEMP/goh-workspace"
          python scripts/smoke.py "${package[0]}" --launcher --mode audit --work "$RUNNER_TEMP/goh-audit"
      - name: Smoke-test installed Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = (Get-ChildItem out/dev/*-installer.exe).FullName
          python scripts/smoke.py $package --work "$env:RUNNER_TEMP/goh-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke.py $package --mode workspace --work "$env:RUNNER_TEMP/goh-workspace"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke.py $package --mode audit --work "$env:RUNNER_TEMP/goh-audit"
      - name: Check out the exact engine source for the update fixture
        if: inputs.target == 'darwin-universal' || runner.os == 'Windows'
        uses: actions/checkout@v5
        with:
          repository: Sanidhya14321/goh
          ref: ${{ inputs.engine_tag }}
          path: fixture-upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Test signed-manifest update and tamper rejection
        if: inputs.target == 'darwin-universal' || runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/update-smoke.py --target "$TARGET" --engine .cache/engine \
            --upstream fixture-upstream --work "$RUNNER_TEMP/goh-update"
      - name: Configure Apple signing
        if: inputs.sign && runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_NOTARY_API_KEY: ${{ secrets.MAC_NOTARY_API_KEY }}
          MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER }}
        run: bash scripts/mac-signing.sh
      - name: Authenticate to Microsoft Artifact Signing
        if: inputs.sign && runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Configure Microsoft Artifact Signing
        if: inputs.sign && runner.os == 'Windows'
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          ARTIFACT_SIGNING_CLIENT_VERSION: ${{ vars.ARTIFACT_SIGNING_CLIENT_VERSION }}
        run: scripts/windows-signing.ps1
      - name: Build, sign and verify distribution assets
        if: inputs.sign
        shell: bash
        env:
          DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEY }}
          MAC_SIGN_IDENTITY: ${{ vars.MAC_SIGN_IDENTITY }}
          DESKTOP_REPO: ${{ github.repository }}
        run: |
          if [[ "$CHANNEL" == preview ]]; then
            feed="https://api.github.com/repos/$DESKTOP_REPO/releases?per_page=50"
          else
            feed="https://github.com/$DESKTOP_REPO/releases/latest/download/update.json"
          fi
          python scripts/package.py --target "$TARGET" --engine .cache/engine --engine-tag "$ENGINE_TAG" \
            --version "$DESKTOP_VERSION" --channel "$CHANNEL" --output out/release --release \
            --feed "$feed" --update-key "$DESKTOP_UPDATE_PUBLIC_KEY"
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ inputs.target }}
          path: |
            out/${{ inputs.sign && 'release' || 'dev' }}/*.dmg
            out/${{ inputs.sign && 'release' || 'dev' }}/*.deb
            out/${{ inputs.sign && 'release' || 'dev' }}/*.exe
            out/${{ inputs.sign && 'release' || 'dev' }}/*.zip
            out/${{ inputs.sign && 'release' || 'dev' }}/engine-*.json
          if-no-files-found: error
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ inputs.target }}
          path: |
            ${{ runner.temp }}/goh-smoke/result.json
            ${{ runner.temp }}/goh-smoke/desktop.log
            ${{ runner.temp }}/goh-update/*-result.json
            ${{ runner.temp }}/goh-workspace/result.json
            ${{ runner.temp }}/goh-audit/result.json
            ${{ runner.temp }}/goh-audit/report.json
            ${{ runner.temp }}/goh-audit/desktop.log
          if-no-files-found: ignore
