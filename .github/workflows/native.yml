name: Native build and smoke
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_tag:
        description: Exact published stable engine tag (defaults to the verified pin)
        type: string
permissions:
  contents: read
  attestations: read
  id-token: write
jobs:
  engine:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.engine.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: engine
        env:
          REQUESTED_TAG: ${{ inputs.engine_tag }}
        run: |
          tag="${REQUESTED_TAG:-$(cat engine-version.txt)}"
          [[ "$tag" =~ ^v1\.([1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: darwin-universal }
          - { runner: macos-15-intel, target: darwin-amd64 }
          - { runner: ubuntu-24.04, target: linux-amd64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-2025, target: windows-amd64 }
          - { runner: windows-11-arm, target: windows-arm64 }
    uses: ./.github/workflows/package.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      engine_tag: ${{ needs.engine.outputs.tag }}
      channel: dev
      version: 0.1.6
      sign: false
